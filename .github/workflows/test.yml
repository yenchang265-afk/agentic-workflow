name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and unit tests (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Must precede setup-node: `cache: 'pnpm'` shells out to `pnpm store path`
      # and fails if pnpm is not on PATH yet. Placing it first also gives pnpm to
      # every later step, including the install round trips. The version comes
      # from the root package.json `packageManager` field — never duplicate it here.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Floor of engines.node — 22.13 is the first release with an unflagged
          # node:sqlite, which the hub's opencode.db token backfill imports.
          node-version: '22.13'
          cache: 'pnpm'

      # Never add --ignore-scripts here: the root `prepare` is what builds
      # @agentic-workflow/core, and every later step consumes its dist/.
      - name: Install dependencies (builds @agentic-workflow/core via prepare)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm run typecheck:all

      - name: Test (all workspaces + hooks + installer scripts)
        run: pnpm run test:all

      - name: Generated prompts are in sync with prompts/ sources
        run: |
          node scripts/gen-prompts.mjs
          git diff --exit-code -- \
            plugins/opencode/agents plugins/claude/agents plugins/qwen/agents \
            plugins/opencode/commands \
            plugins/claude/verbs plugins/qwen/verbs \
            plugins/claude/skills/workflow-orchestration plugins/qwen/skills

      - name: Bundled hooks are in sync with hooks/src/ sources
        run: |
          node scripts/build-hooks.mjs
          git diff --exit-code -- plugins/claude/hooks plugins/qwen/hooks

      - name: Build the hub (typecheck alone never exercises the web bundle)
        run: pnpm --filter @agentic-workflow/hub run build

      - name: Build and smoke-run the MCP server (both hosts)
        run: |
          pnpm --filter agentic-workflow-mcp run build
          for host in claude qwen; do
            # Match anywhere in the output, not just line 1: startup reporting
            # legitimately prints ahead of the ready line (a push build checks out
            # feature/<id>, which the loop reads as a leftover worktree).
            out=$(AGENTIC_WORKFLOW_HOST=$host node plugins/claude/mcp-server/dist/server.js < /dev/null 2>&1)
            echo "$host: $out"
            echo "$out" | grep -q "MCP server ready"
          done

      - name: Shell-script syntax check
        run: bash -n install.sh uninstall.sh bootstrap.sh scripts/clean.sh plugins/claude/install.sh

      - name: Shellcheck
        run: shellcheck --severity=error install.sh uninstall.sh bootstrap.sh scripts/clean.sh plugins/claude/install.sh

      - name: Install-script round trip (install twice, then uninstall)
        run: |
          d=$(mktemp -d)
          ./install.sh opencode "$d"
          ./install.sh opencode "$d"
          ./uninstall.sh opencode "$d"
          leftovers=$(find "$d" -lname "$GITHUB_WORKSPACE/*" 2>/dev/null)
          if [ -n "$leftovers" ]; then
            echo "uninstall left entries behind:"; echo "$leftovers"; exit 1
          fi

      # ubuntu-latest ships pwsh; this only checks the PowerShell ports parse —
      # symlink creation is unprivileged on Linux, so a full round trip here
      # would not exercise the Windows fallback-to-copy path anyway.
      - name: PowerShell script syntax check
        shell: pwsh
        run: |
          $files = @('install.ps1', 'uninstall.ps1', 'plugins/claude/install.ps1')
          $hadErrors = $false
          foreach ($f in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hadErrors = $true
              Write-Host "=== $f ==="
              foreach ($e in $errors) { Write-Host $e }
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($hadErrors) { exit 1 }

      - name: PowerShell install-script round trip (install twice, then uninstall)
        shell: pwsh
        # $ErrorActionPreference = 'Stop' inside both scripts turns any internal
        # failure into a terminating error, which fails this step on its own —
        # neither script shells out for the opencode-only path, so $LASTEXITCODE
        # would stay stale (even $null, which compares unequal to 0) rather than
        # reflect success.
        run: |
          $d = New-Item -ItemType Directory -Path (Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName()))
          ./install.ps1 opencode $d.FullName --no-config
          ./install.ps1 opencode $d.FullName --no-config
          ./uninstall.ps1 opencode $d.FullName
          $leftovers = Get-ChildItem -Path $d.FullName -Recurse -Force -ErrorAction SilentlyContinue | Where-Object {
            $item = Get-Item -LiteralPath $_.FullName -Force
            ($item.LinkType -eq 'SymbolicLink') -and ($item.Target -join '').StartsWith($env:GITHUB_WORKSPACE)
          }
          if ($leftovers) {
            Write-Host "uninstall left entries behind:"
            $leftovers | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      # --no-config: the wizard would write a user-scope ~/.config config, which
      # layers under every repo config and would silently change what later steps
      # (and a developer's own test run) resolve.
      - name: Qwen install-script round trip (install twice, then uninstall)
        run: |
          d=$(mktemp -d)
          printf '{"theme":"dark"}\n' > "$d/settings.json"
          cp "$d/settings.json" "$d/settings.expected.json"
          QWEN_CONFIG_DIR="$d" ./install.sh qwen "$d" --no-config
          QWEN_CONFIG_DIR="$d" ./install.sh qwen "$d" --no-config
          test -f "$d/agents/workflow-verify.md" || { echo "agents were not installed"; exit 1; }
          test -f "$d/commands/agentic-workflow/engineering.md" || { echo "commands were not installed"; exit 1; }
          node -e 'const s=require("'"$d"'/settings.json");
            const n=Object.values(s.hooks).flatMap(g=>g.flatMap(x=>x.hooks.map(h=>h.name)));
            if (new Set(n).size !== n.length) { console.error("duplicate hooks after 2 installs:", n); process.exit(1); }
            if (!s.mcpServers["agentic-workflow"]) { console.error("MCP server not merged"); process.exit(1); }'
          QWEN_CONFIG_DIR="$d" ./uninstall.sh qwen "$d"
          leftovers=$(find "$d" -lname "$GITHUB_WORKSPACE/*" 2>/dev/null)
          if [ -n "$leftovers" ]; then
            echo "uninstall left entries behind:"; echo "$leftovers"; exit 1
          fi
          # settings.json is the user's file: uninstall must restore it exactly.
          node -e '
            const fs = require("fs");
            const read = (f) => JSON.stringify(JSON.parse(fs.readFileSync(f, "utf8")));
            const before = read(process.argv[1] + "/settings.expected.json");
            const after = read(process.argv[1] + "/settings.json");
            if (before !== after) {
              console.error("uninstall did not restore settings.json\nexpected: " + before + "\nactual:   " + after);
              process.exit(1);
            }
          ' "$d"
